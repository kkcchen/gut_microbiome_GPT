paths:
  output_dir: outputs/eval/raw_baselines/rel_ab
  train_path: /scratch/kchen13/hmc_final_fixed/downstream_train.h5ad
  test_path: /scratch/kchen13/hmc_final_fixed/downstream_test.h5ad
eval:
  seed: 42
  with_model: false
