    helicobacter_pylori_infection:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
    hbv_infection:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
    hiv_infection:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
    sunflower_seed_oil_emollient_therapy:
      label_type: categorical_label
      ignored_labels:
      - extraction_control
      target_col: downstream_task
    chemotherapy:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
    type_1_diabetes:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
    crohns_disease:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
    diarrhea:
