paths:
  output_dir: "./outputs/eval/denoising_dm_nll_binomial_raw_normed_loss/"
  pretrained_model_dir: "./outputs/pretrain/denoising_dm_nll_binomial_raw_normed_loss/"
  checkpoint_path: "./outputs/pretrain/denoising_dm_nll_binomial_raw_normed_loss/best_model/best_model/model.safetensors"
  eval_files: 
    - "/project/aip-rahulgk/gutmodel/hmc_final/downstream_train.h5ad"
    - "/project/aip-rahulgk/gutmodel/hmc_final/downstream_test.h5ad"

eval:
  seed: 423985693
  overwrite_output_dir: false
  embedding_type: "cls" # choices: cls, mean, sum
  return_full_output: false # whether to return the full output of the model (e.g. for probing) or just the embeddings (for downstream tasks)
  save_embeddings: true
  save_metadata: true
  tasks: ['denoising']
  eval_on_downstream_tasks: true  

data:
  batch_size: 128
  norm_strategy: "none" # choices: clr, none
  split_key: "study_id" # we probably want to split train/val by entire studies, so it resembles close to real-world/test scenario
  use_batch_labels: false
  max_seq_len: 500
  num_workers: 4
  downsample_distribution: "binomial"

model:

  # === FLEXIBLE ARCHITECTURE SECTION ===
  # Any key added here is automatically passed to the model config dict
  params:
    d_model: 128
    nhead: 8
    d_proj: 128
    seq_len: 500
    d_hid: 512
    nlayers: 7
    dropout: 0.1
    abundance_emb_style: "continuous" # choices: scaling, continuous, category
    # Example: If you change architecture, just add new keys here
    # activation: "gelu" 
    # use_flash_attn: true
    model_distribution: "dm" # choices: zinb,...
    use_gnn: false



# optional, if you want to specify downstream tasks
downstream_tasks_config:
  methods:
    xgboost:
      search_type: "random"
  tasks:
    age:
      label_type: "continuous_label"
      ignored_labels: []
      target_col: "downstream_task"
    bmi:
      label_type: "continuous_label"
      ignored_labels: []
      target_col: "downstream_task"
    sex:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    supplement:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    helicobacter_pylori_infection:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    hbv_infection:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    hiv_infection:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    sunflower_seed_oil_emollient_therapy:
      label_type: "categorical_label"
      ignored_labels: ['extraction_control']
      target_col: "downstream_task"
    chemotherapy:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    type_1_diabetes:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    crohns_disease:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    diarrhea:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    location:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"