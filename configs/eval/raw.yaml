paths:
  output_dir: "outputs/eval_2"
  train_path: "/project/aip-rahulgk/gutmodel/hmc_final/downstream_train.h5ad"
  test_path: "/project/aip-rahulgk/gutmodel/hmc_final/downstream_test.h5ad"

eval:
  seed: 42
  with_model: False

downstream_tasks_config:
  normalization: "clr" # choice of normalization method for downstream tasks (e.g. "clr", "log", "none")
  prevalence_threshold: 0.01 # minimum prevalence threshold for including features in downstream tasks (e.g. 0.01 for 1% prevalence)
  abundance_threshold: 0.05 # minimum abundance threshold for including features in downstream tasks (e.g. 0.001 for 0.1% abundance)
  methods:
    xgboost:
      search_type: "none"
  tasks:
    age:
      label_type: "continuous_label"
      ignored_labels: []
      target_col: "downstream_task"
    bmi:
      label_type: "continuous_label"
      ignored_labels: []
      target_col: "downstream_task"
    sex:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    supplement:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    helicobacter_pylori_infection:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    hbv_infection:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    hiv_infection:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    sunflower_seed_oil_emollient_therapy:
      label_type: "categorical_label"
      ignored_labels: ['extraction_control']
      target_col: "downstream_task"
    chemotherapy:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    type_1_diabetes:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    crohns_disease:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    diarrhea:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    location:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
  


