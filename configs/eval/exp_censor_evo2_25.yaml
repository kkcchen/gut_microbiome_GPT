paths:
  output_dir: "./outputs/eval/exp_censor/evo2_25/"
  pretrained_model_dir: "/scratch/tiantian/hmc/outputs/exp_censor/evo2_censored_25/"
  checkpoint_path: "/scratch/tiantian/hmc/outputs/exp_censor/evo2_censored_25/best_model/best_model/model.safetensors"
  eval_files: 
    - "/project/aip-rahulgk/gutmodel/hmc_final_fixed/downstream_train.h5ad"
    - "/project/aip-rahulgk/gutmodel/hmc_final_fixed/downstream_test.h5ad"

eval:
  seed: 423985693
  overwrite_output_dir: false
  embedding_type: "mean" # choices: cls, mean, sum
  return_full_output: false # whether to return the full output of the model (e.g. for probing) or just the embeddings (for downstream tasks)
  save_embeddings: true
  save_metadata: true
  tasks: ['masking'] # contrastive, denoising, 
  eval_on_downstream_tasks: true  

data:
  batch_size: 128
  norm_strategy: "log_rel_abundance" # choices: clr, none
  split_key: "study_id" # we probably want to split train/val by entire studies, so it resembles close to real-world/test scenario
  use_batch_labels: false
  max_seq_len: 200
  num_workers: 4

model:

  # === FLEXIBLE ARCHITECTURE SECTION ===
  # Any key added here is automatically passed to the model config dict
  params:
    d_model: 128
    d_proj: 128
    seq_len: 200
    nhead: 8
    d_hid: 512
    nlayers: 3 #3 7
    dropout: 0.1
    abundance_emb_style: "continuous" # choices: scaling, continuous, category
    sample_emb_style: "avg-pool" # "cls"
    preinitialized_taxa_embedding_path: "/scratch/tiantian/hmc/censored_data/evo2_embeds_censored_25.npy"
    freeze_preinitialized_embeddings: true
    use_gnn: false



# optional, if you want to specify downstream tasks
downstream_tasks_config:
  methods:
    xgboost:
      search_type: "random"
  tasks:
    age:
      label_type: "continuous_label"
      ignored_labels: []
      target_col: "downstream_task"
    bmi:
      label_type: "continuous_label"
      ignored_labels: []
      target_col: "downstream_task"
    sex:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    supplement:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    helicobacter_pylori_infection:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    hbv_infection:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"
    location:
      label_type: "categorical_label"
      ignored_labels: []
      target_col: "downstream_task"