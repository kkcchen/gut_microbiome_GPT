paths:
  pretrained_model_dir: outputs/pretrain/pretrained_baseline/pretrained_baseline_bins20_mask030
  checkpoint_path: outputs/pretrain/pretrained_baseline/pretrained_baseline_bins20_mask030/best_model/best_model/pytorch_model.bin
  output_dir: outputs/eval/embedding_baselines/pretrained_baseline_bins20_mask030
  eval_files:
  - /scratch/kchen13/hmc_final_fixed/downstream_train.h5ad
  - /scratch/kchen13/hmc_final_fixed/downstream_test.h5ad
eval:
  seed: 42
  overwrite_output_dir: true
  embedding_type: cls
  return_full_output: false
  save_embeddings: true
  save_metadata: true
  tasks:
  - masking
  eval_on_downstream_tasks: true
  with_model: true
data:
  batch_size: 64
  norm_strategy: binning
  num_bins: 20
  split_key: study_id
  use_batch_labels: true
  num_workers: 4
  max_seq_len: 200
model:
  params:
    d_model: 128
    nhead: 8
    d_hid: 512
    nlayers: 3
    dropout: 0.1
    abundance_emb_style: continuous
    use_gnn: false
    sample_emb_style: cls
downstream_tasks_config:
  methods:
    xgboost:
      search_type: grid
  tasks:
    sex:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
    supplement:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
    helicobacter_pylori_infection:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
    hbv_infection:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
    hiv_infection:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
    sunflower_seed_oil_emollient_therapy:
      label_type: categorical_label
      ignored_labels:
      - extraction_control
      target_col: downstream_task
    chemotherapy:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
    type_1_diabetes:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
    crohns_disease:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
    diarrhea:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
    location:
      label_type: categorical_label
      ignored_labels: []
      target_col: downstream_task
