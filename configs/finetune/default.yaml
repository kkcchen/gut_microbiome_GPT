# Minimal finetuning config - classification
paths:
  finetuning_file: "/path/to/labeled_data.h5ad"
  output_dir: "./results/finetuning_classification"
  taxa_vocab_path: "./results/pretraining/taxa_vocab.json"
  batch_vocab_path: "./results/pretraining/batch_vocab.json"
  checkpoint_path: "/path/to/pretrained_model"

wandb:
  enabled: false
  entity: "haoze-deng-university-of-toronto"
  project: "microbiome-finetuning"
  run_name: finetune_location_classification
  run_notes: "Finetuning on location classification task"

data:
  norm_strategy: "clr"  # Should match pretraining
  split_key: null
  val_size: 0.2
  use_batch_labels: true
  max_seq_len: 200
  num_workers: 4
  downsample_distribution: null  # Not used in finetuning (no perturbation)
  
  # Finetuning-specific data settings
  label_column: "categorical_label"  # Column in adata.obs with labels
  finetune_task_name: "location"  # Value in adata.obs['downstream_task'] to filter


training:
  seed: 42
  init_lr: 1e-4 
  batch_size: 32
  max_epochs: 50
  cosine_warmup_ratio_or_step: 0.1
  log_interval: 10
  patience: 10
  grad_accumulation_steps: 1
  enable_fp16: false
  notes: "Finetuning pretrained model on location classification"
  
  # Finetuning-specific settings
  finetune_mode: "partial" 
  tasks: []  # Empty for finetuning (not used, model uses finetune_forward)
  
  # Not used in finetuning but kept for compatibility
  train_mask_ratio: null
  contrastive_temperature: null
  masking_prob: null

validation:
  batch_size: 64
  eval_interval_epochs: 1

# Model (match pretrained)
model:
  params:
    d_model: 128
    nhead: 8
    d_hid: 512
    nlayers: 6
    dropout: 0.1
    abundance_emb_style: "continuous"
    sample_emb_style: "cls"
    use_gnn: false

# W&B
wandb:
  enabled: true
  project: "microbiome-finetuning"
