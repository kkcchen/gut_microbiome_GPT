# Minimal finetuning config - classification
paths:
  downstream_train: "/project/aip-rahulgk/gutmodel/hmc_final_fixed/downstream_train.h5ad"
  downstream_test: "/project/aip-rahulgk/gutmodel/hmc_final_fixed/downstream_test.h5ad"  # Optional
  output_dir: "./outputs/finetune/masking_log_rel_abundance_len200_7layers_ratio_70_updated/"
  model_config_path: "${paths.output_dir}/model_config.json"
  taxa_vocab_path: "./outputs/pretrain/masking_log_rel_abundance_len200_7layers_ratio_70_updated/taxa_vocab.pkl"
  # batch_vocab_path: "./results/pretraining/batch_vocab.json"
  checkpoint_path: "./outputs/pretrain/masking_log_rel_abundance_len200_7layers_ratio_70_updated/best_model/best_model/model.safetensors"

wandb:
  enabled: true
  entity: "haoze-deng-university-of-toronto"
  project: "microbiome-finetuning"
  run_name: masking_log_rel_abundance_len200_7layers_ratio_70_updated_finetune
  run_notes: "Finetuning on location classification task"

data:
  norm_strategy: "log_rel_abundance"  # Should match pretraining
  split_key: null
  val_size: 0.2
  use_batch_labels: false
  max_seq_len: 200
  num_workers: 4
  
  # Finetuning-specific data settings
  label_column: "categorical_label"  # Column in adata.obs with labels
  finetune_task_name: "location"  # Value in adata.obs['downstream_task'] to filter


training:
  seed: 423985693
  init_lr: 1e-4 
  batch_size: 64
  max_epochs: 5
  cosine_warmup_ratio_or_step: 0.1
  log_interval: 10
  patience: 10
  grad_accumulation_steps: 1
  enable_fp16: false
  notes: "Finetuning pretrained model on location classification"
  
  # Finetuning-specific settings
  finetune_mode: "partial" 
  tasks: []  # Empty for finetuning (not used, model uses finetune_forward)
  
  # Not used in finetuning but kept for compatibility
  train_mask_ratio: null
  masking_prob: null

validation:
  batch_size: 64
  eval_interval_epochs: 1

# Model (match pretrained)
model:
  params:
    d_model: 128
    seq_len: 200
    nhead: 8
    d_hid: 512
    nlayers: 7
    dropout: 0.1
    abundance_emb_style: "continuous"
    sample_emb_style: "cls"
    use_gnn: false

debug:
  nrows: null
  start_over: false

