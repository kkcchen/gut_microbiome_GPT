paths:
  output_dir: outputs/pretrain/pretrained_baseline/pretrained_baseline_bins20_mask030
  model_config_path: ${paths.output_dir}/model_config.json
  ann_table_path: /scratch/kchen13/hmc_final_fixed/pretrain.h5ad
checkpoint_path: null
wandb:
  enabled: true
  entity: haoze-deng-university-of-toronto
  project: microbiome-pretrain-sweep-pretrained-baseline
  run_name: pretrained_baseline_bins20_mask030
  run_notes: 'Pretrained default-scGPT baseline: norm_strategy=binning, num_bins=20,
    masking_prob=0.3, tasks=[masking, masking_from_cls] (the same ''default scGPT''
    recipe as real_runs/baseline_random_init_default_scgpt.yaml), but with real pretraining
    (max_epochs=200, like real_runs/stage1-4) instead of max_epochs=0, and finetune_mode=partial
    (like real_runs/stage1-4) instead of full. Compare against real_runs/baseline_random_init_default_scgpt.yaml''s
    finetune_summary.md (pretrained vs. random-init, num_bins=10 cell only) and against
    real_runs/stage4_bins20_mask030.yaml''s finetune_summary.md (same grid cell, different
    task family).'
training:
  seed: 42
  init_lr: 0.001
  batch_size: 64
  max_epochs: 200
  cosine_warmup_ratio_or_step: 0.1
  log_interval: 10
  patience: 20
  grad_accumulation_steps: 1
  enable_fp16: false
  notes: 'Pretrained default-scGPT baseline: norm_strategy=binning, num_bins=20, masking_prob=0.3,
    tasks=[masking, masking_from_cls] (the same ''default scGPT'' recipe as real_runs/baseline_random_init_default_scgpt.yaml),
    but with real pretraining (max_epochs=200, like real_runs/stage1-4) instead of
    max_epochs=0, and finetune_mode=partial (like real_runs/stage1-4) instead of full.
    Compare against real_runs/baseline_random_init_default_scgpt.yaml''s finetune_summary.md
    (pretrained vs. random-init, num_bins=10 cell only) and against real_runs/stage4_bins20_mask030.yaml''s
    finetune_summary.md (same grid cell, different task family).'
  tasks:
  - masking
  - masking_from_cls
  masking_prob: 0.3
  masking_taxa_prob: 0.15
  optimizer: adamw
  lr_scheduler: cosine
  grad_clip: 1.0
  checkpoint_every: 5
  finetune_mode: none
validation:
  batch_size: 64
data:
  norm_strategy: binning
  num_bins: 20
  split_key: study_id
  val_size: 0.1
  use_batch_labels: true
  max_seq_len: 200
  num_workers: 4
  metadata_fields: []
model:
  params:
    d_model: 128
    nhead: 8
    d_hid: 512
    nlayers: 3
    dropout: 0.1
    abundance_emb_style: continuous
    use_gnn: false
    sample_emb_style: cls
    preinitialized_taxa_embedding_path: null
    freeze_preinitialized_embeddings: false
    preinitialized_embedding_projection: linear
debug:
  nrows: null
  start_over: true
finetune:
  paths:
    downstream_train: /scratch/kchen13/hmc_final_fixed/downstream_train.h5ad
    downstream_test: /scratch/kchen13/hmc_final_fixed/downstream_test.h5ad
  training:
    init_lr: 0.0001
    max_epochs: 10
    patience: 10
    finetune_mode: partial
    batch_size: 64
    use_class_weights: true
  val_size: 0.2
