paths:
  output_dir: "./outputs/pretrain/qwen/masking_clr_len200_3layers_ratio_50_qwen_mlp"
  model_config_path: "${paths.output_dir}/model_config.json"
  ann_table_path: "/project/aip-rahulgk/gutmodel/hmc_final_fixed/pretrain.h5ad"

  # vocab_path: null
  # best_dir: "${paths.output_top_level}/best_model/"
  # checkpoint_dir: "${paths.output_top_level}/checkpoints/"
  # data_restore_dir: "${paths.output_top_level}/data_cache/"
  # intermediate_dir: "${paths.output_top_level}/intermediate/"
  # taxa_vocab_path: "${paths.output_top_level}/taxa_vocab.json"

wandb:
  enabled: true
  entity: "haoze-deng-university-of-toronto"
  project: "microbiome-foundation"
  run_name: masking_clr_len200_3layers_ratio_50_qwen_mlp
  run_notes: null

training:
  seed: 423985693
  init_lr: 1e-3
  batch_size: 64
  max_epochs: 200 # for testing
  cosine_warmup_ratio_or_step: 0.1
  log_interval: 10
  patience: 20
  grad_accumulation_steps: 1
  enable_fp16: false
  masking_prob: 0.50
  notes: "Testing masking after refactor"
  tasks: ["masking"]

validation:
  batch_size: 128
  eval_interval_epochs: 1

data:
  norm_strategy: "clr" # choices: clr, none, rel_abundance, log_rel_abundance, log_counts, binning, binary
  split_key: "study_id" # we probably want to split train/val by entire studies, so it resembles close to real-world/test scenario
  val_size: 0.1
  use_batch_labels: false
  max_seq_len: 200
  num_workers: 4
  

model:
  # === FLEXIBLE ARCHITECTURE SECTION ===
  # Any key added here is automatically passed to the model config dict
  params:
    d_model: 128
    nhead: 8
    d_hid: 512
    nlayers: 3 #3 7
    dropout: 0.1
    abundance_emb_style: "continuous" # choices: scaling, continuous, concatenation
    # freeze_vocab: false
    # freeze_value_encoder: false
    # do_attn_mask: false
    # Example: If you change architecture, just add new keys here
    # activation: "gelu" 
    # use_flash_attn: true
    use_gnn: false

    # For fixed taxa embeddings:
    preinitialized_taxa_embedding_path: "/project/aip-rahulgk/gutmodel/hmc_final_fixed/qwen3_taxa_embeddings.npy"
    freeze_preinitialized_embeddings: true # frozen during pretraining
    preinitialized_embedding_projection: "mlp" # choices: mlp, linear


debug:
  # nrows: null
  start_over: false

# Drives the automatic finetune-all-tasks chain (see utils/finetune_orchestration.py)
# that scripts/train.py runs after pretraining finishes.
finetune:
  paths:
    downstream_train: "/project/aip-rahulgk/gutmodel/hmc_final_fixed/downstream_train.h5ad"
    downstream_test: "/project/aip-rahulgk/gutmodel/hmc_final_fixed/downstream_test.h5ad"
  training:
    init_lr: 1e-4
    max_epochs: 50
    patience: 10
    finetune_mode: "partial"
    batch_size: 64
    use_class_weights: true
  val_size: 0.2