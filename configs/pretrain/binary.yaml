paths:
  output_dir: "outputs/pretrain"
  model_config_path: "outputs/pretrain/model_config.json"
  ann_table_path: '/mnt/c/Users/kkccc/OneDrive - University of Toronto/MScAC/hmc_final_fixed/hmc_final_fixed/downstream_test.h5ad'

checkpoint_path: null  # set to an accelerator checkpoint dir to resume training

wandb:
  enabled: false
  entity: null
  project: "microbiome-foundation"
  run_name: null
  run_notes: null

training:
  seed: 42
  init_lr: 1e-3
  batch_size: 64
  max_epochs: 200
  cosine_warmup_ratio_or_step: 0.1
  log_interval: 10
  patience: 20
  grad_accumulation_steps: 1
  enable_fp16: false
  notes: "debug - binary presence/absence"
  tasks: ["masking", "masking_from_cls", "masking_taxa"]
  masking_prob: 0.15
  masking_taxa_prob: 0.15
  optimizer: "adamw" # choices: adamw, sgd
  lr_scheduler: "cosine" # choices: cosine, linear
  grad_clip: 1.0
  checkpoint_every: 5
  finetune_mode: "none" # choices: none, full, partial -- keeps the shared trainer on the pretraining path
  w_denoising: 1.0 # only applies if "denoising" is in tasks
  w_masking_from_cls: 1.0
  w_masking_taxa: 1.0

validation:
  batch_size: 2
  eval_interval_epochs: 1

data:
  norm_strategy: "binary" # presence/absence (0/1) instead of relative abundance -- choices: clr, none, binning, binary, rel_abundance, log_rel_abundance, log_counts
  split_key: "study_id" # we probably want to split train/val by entire studies, so it resembles close to real-world/test scenario
  val_size: 0.1
  use_batch_labels: true
  max_seq_len: 200
  num_workers: 4
  metadata_fields: []


model:
  # === FLEXIBLE ARCHITECTURE SECTION ===
  # Any key added here is automatically passed to the model config dict
  params:
    d_model: 16
    nhead: 2
    d_hid: 64
    nlayers: 2
    dropout: 0.1
    abundance_emb_style: "continuous" # choices: scaling, continuous, concatenation
    use_gnn: false
    sample_emb_style: "cls" # choices: cls, avg-pool
    model_distribution: null # choices: dm -- only required if "denoising" is in tasks
    seq_len: null # only used by the "denoising_from_token" task
    preinitialized_taxa_embedding_path: null
    freeze_preinitialized_embeddings: false
    preinitialized_embedding_projection: "linear" # choices: linear, mlp -- unused while path above is null
    # Example: If you change architecture, just add new keys here
    # activation: "gelu"
    # use_flash_attn: true

debug:
  nrows: 50
  start_over: true
