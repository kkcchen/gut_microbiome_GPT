paths:
  output_dir: "outputs/pretrain/real_runs/stage1/stage1_norm_rel_abundance"
  model_config_path: "${paths.output_dir}/model_config.json"
  ann_table_path: "/scratch/kchen13/hmc_final_fixed/pretrain.h5ad"

checkpoint_path: null  # set to an accelerator checkpoint dir to resume training

wandb:
  enabled: true
  entity: "haoze-deng-university-of-toronto"
  project: "microbiome-pretrain-sweep-stage1"
  run_name: "stage1_norm_rel_abundance"
  run_notes: "Stage 1 sweep: norm_strategy=rel_abundance"

training:
  seed: 42
  init_lr: 1e-3
  batch_size: 64
  max_epochs: 200
  cosine_warmup_ratio_or_step: 0.1
  log_interval: 10
  patience: 20
  grad_accumulation_steps: 1
  enable_fp16: false
  notes: "Stage 1 sweep: norm_strategy=rel_abundance"
  tasks: ["masking"]
  masking_prob: 0.15
  optimizer: "adamw" # choices: adamw, sgd
  lr_scheduler: "cosine" # choices: cosine, linear
  grad_clip: 1.0
  checkpoint_every: 5
  finetune_mode: "none" # choices: none, full, partial -- keeps the shared trainer on the pretraining path

validation:
  batch_size: 64

data:
  norm_strategy: "rel_abundance" # choices: clr, none, binning, binary, rel_abundance, log_rel_abundance, log_counts
  num_bins: 15  # unused under norm_strategy=rel_abundance
  split_key: "study_id" # we probably want to split train/val by entire studies, so it resembles close to real-world/test scenario
  val_size: 0.1
  use_batch_labels: true
  num_workers: 4
  metadata_fields: []

model:
  # === FLEXIBLE ARCHITECTURE SECTION ===
  # Any key added here is automatically passed to the model config dict
  params:
    d_model: 128
    nhead: 8
    d_hid: 512
    nlayers: 3
    dropout: 0.1
    abundance_emb_style: "continuous" # choices: scaling, continuous, concatenation -- fixed for Stage 1 (representation sweep only)
    use_gnn: false
    sample_emb_style: "cls" # choices: cls, avg-pool -- fixed for Stage 1
    preinitialized_taxa_embedding_path: null
    freeze_preinitialized_embeddings: false
    preinitialized_embedding_projection: "linear" # choices: linear, mlp -- unused while path above is null

debug:
  nrows: null
  start_over: true

# Drives the automatic finetune-all-tasks chain (see utils/finetune_orchestration.py)
# that scripts/train.py runs after pretraining finishes.
finetune:
  paths:
    downstream_train: "/scratch/kchen13/hmc_final_fixed/downstream_train.h5ad"
    downstream_test: "/scratch/kchen13/hmc_final_fixed/downstream_test.h5ad"
  training:
    init_lr: 1e-4
    max_epochs: 10
    patience: 10
    finetune_mode: "partial"
    batch_size: 64
    use_class_weights: true
  val_size: 0.2
